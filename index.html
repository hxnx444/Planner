<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lock-In Diary</title>
<meta name="description" content="A pastel pixel diary and planner for November and December 2026.">
<meta name="theme-color" content="#F4B6D2">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lock-In Diary">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="cover" class="cover" hidden></div>
<div class="desk">
  <aside class="spine" aria-label="Diary sections">
    <button type="button" class="brand" id="sbrand" aria-label="Show the diary cover"></button>
    <nav class="snav" id="snav"></nav>
    <div class="sfoot" id="sfoot"></div>
  </aside>
  <div class="rings" aria-hidden="true"></div>
  <main class="book">
    <header class="mbar">
      <button type="button" class="brand" id="mbrand" aria-label="Show the diary cover"></button>
      <span class="sp"></span>
      <button type="button" class="btn sm ghost" data-act="backup" id="mbackup"></button>
    </header>
    <div id="page" class="page" tabindex="-1"></div>
  </main>
</div>
<nav class="dock" id="dock" aria-label="Main sections"></nav>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px;font-family:sans-serif">Lock-In Diary needs JavaScript to run.</p></noscript>
<script src="icons.js"></script>
<script src="app.js"></script>
</body>
</html>
